[project]
name = "student-lms-ai-frontend"
version = "1.0.0"
description = "Streamlit frontend for Student LMS AI system"
authors = [
    {name = "Shivam bhatia", email = "awsshiv096@gmail.com"},
]
dependencies = [
    "streamlit>=1.28.0",
    "requests>=2.31.0",
]
requires-python = ">=3.8"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontend"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
]
